<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fishing Adventure</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-wrap">
  <header><h1>🎣 Fishing Adventure</h1><div class="score">🐟 Score: <span id="score">0</span></div></header>
  <div class="stage"><canvas id="game" width="900" height="570" aria-label="Fishing game"></canvas></div>
  <div class="controls">
    <button id="btnA" type="button">A · SWIM</button>
    <button id="btnB" type="button">B · FISH</button>
  </div>
  <p class="help">Press <b>A</b> to make the fish swim for 3 seconds. Press <b>B</b> to lower and retrieve your hook. Each fish caught earns 1 point. You can also use the A and B keys on your keyboard.</p>
</div>
<script src="game.js" defer></script>
</body>
</html>
